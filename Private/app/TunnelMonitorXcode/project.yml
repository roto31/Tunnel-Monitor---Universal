name: TunnelMonitor
options:
  bundleIdPrefix: com.tunnel
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1.1.0"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  TunnelMonitor:
    type: application
    platform: macOS
    sources:
      - path: ../TunnelMonitor/Sources/TunnelMonitor
        type: group
    settings:
      PRODUCT_NAME: Tunnel Monitor
      PRODUCT_BUNDLE_IDENTIFIER: com.tunnel.monitor
      INFOPLIST_FILE: ../TunnelMonitor/Resources/Info.plist
      CODE_SIGN_ENTITLEMENTS: ../../build/TunnelMonitor.entitlements
      GENERATE_INFOPLIST_FILE: NO
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    entitlements:
      path: ../../build/TunnelMonitor.entitlements
    dependencies:
      - target: TunnelMonitorWidgetExtension
        embed: true
  TunnelMonitorWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: TunnelMonitorWidget
        type: group
    settings:
      PRODUCT_NAME: TunnelMonitorWidgetExtension
      PRODUCT_BUNDLE_IDENTIFIER: com.tunnel.monitor.widget
      CODE_SIGN_ENTITLEMENTS: TunnelMonitorWidget/TunnelMonitorWidget.entitlements
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Tunnel Monitor
      INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
      SKIP_INSTALL: YES
    entitlements:
      path: TunnelMonitorWidget/TunnelMonitorWidget.entitlements
schemes:
  TunnelMonitor:
    build:
      targets:
        TunnelMonitor: all
        TunnelMonitorWidgetExtension: all
    run:
      config: Release
