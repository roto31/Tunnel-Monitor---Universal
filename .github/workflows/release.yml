name: Release macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without v prefix (e.g. 2.0.0). Required for manual runs."
        required: true
        default: "2.0.0"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build Tunnel Monitor.app and .pkg
    runs-on: macos-14
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          else
            echo "ERROR: no version" >&2
            exit 1
          fi
          echo "version=${V}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version: ${V}"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Import signing cert
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          set -euo pipefail
          CERT="${RUNNER_TEMP}/signing.p12"
          KEYCHAIN="${RUNNER_TEMP}/build.keychain"
          KEYCHAIN_PWD="github-actions"
          echo "${MACOS_CERT_P12_BASE64}" | base64 --decode > "${CERT}"
          security create-keychain -p "${KEYCHAIN_PWD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PWD}" "${KEYCHAIN}"
          security import "${CERT}" -k "${KEYCHAIN}" -P "${MACOS_CERT_P12_PASSWORD}" \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PWD}" "${KEYCHAIN}"
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')

      - name: Build .pkg and .app
        working-directory: Public
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}" \
            TM_SKIP_LIQUID_GLASS=1 \
            ARCHIVE_RELEASE=1 \
            bash build/build-pkg.sh

      - name: Package .app zip
        working-directory: Public/build/dist
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "Tunnel Monitor.app" "Tunnel-Monitor-${V}-macOS.app.zip"

      - name: Collect release files
        id: artifacts
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          PKG="Public/build/dist/Tunnel-Monitor-${V}.pkg"
          ZIP="Public/build/dist/Tunnel-Monitor-${V}-macOS.app.zip"
          shopt -s nullglob
          CHECKSUMS=(Public/build/releases/*-v"${V}"/CHECKSUMS.sha256)
          if [[ ! -f "${PKG}" ]]; then
            echo "ERROR: missing ${PKG}" >&2
            exit 1
          fi
          if [[ ! -f "${ZIP}" ]]; then
            echo "ERROR: missing ${ZIP}" >&2
            exit 1
          fi
          {
            echo "pkg=${PKG}"
            echo "zip=${ZIP}"
            if [[ ${#CHECKSUMS[@]} -gt 0 ]]; then
              echo "checksums=${CHECKSUMS[0]}"
            fi
          } >> "${GITHUB_OUTPUT}"

      - name: Upload build artifact
        uses: actions/upload-artifact@65c88fcd6040d0c04ac32b0487bee3dd4c059fae # v4.6.0
        with:
          name: tunnel-monitor-macos-${{ steps.ver.outputs.version }}
          path: |
            Public/build/dist/Tunnel-Monitor-*.pkg
            Public/build/dist/Tunnel-Monitor-*-macOS.app.zip
            Public/build/releases/**/CHECKSUMS.sha256

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@e7a2fe0680d5a15519aedd8d8ccb62eaa268a500 # v2.9.0
        with:
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.pkg }}
            ${{ steps.artifacts.outputs.zip }}
            ${{ steps.artifacts.outputs.checksums }}
