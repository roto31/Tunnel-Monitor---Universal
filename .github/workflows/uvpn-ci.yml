name: uvpn CI

on:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'wiki/**'
      - 'pyproject.toml'
      - '.github/workflows/uvpn-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'wiki/**'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          pytest -q
      - name: Build macOS menu bar app
        working-directory: src/gui-macos/UniversalVPNMonitor
        run: swift build -c release

  portal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portal extra and test
        run: |
          python -m pip install -e ".[portal,dev]"
          pytest -q tests/test_redaction.py tests/test_statusd.py
      - name: Bandit (statusd + security)
        run: |
          bandit -r src/uvpn/interfaces/statusd src/uvpn/security -ll -q
      - name: pip-audit (portal dependencies)
        run: pip-audit --strict
