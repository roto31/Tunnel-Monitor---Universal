name: legacy tunnel-monitor-core CI

on:
  push:
    paths:
      - 'legacy/vendor/core/**'
      - '.github/workflows/core-ci.yml'
  pull_request:
    paths:
      - 'legacy/vendor/core/**'

permissions:
  contents: read

concurrency:
  group: m4-macos
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq
      - name: Shellcheck core lib
        run: shellcheck legacy/vendor/core/lib/*.sh legacy/vendor/core/bin/monitor-engine.sh
      - name: Bats tests
        run: bats legacy/vendor/core/tests/
