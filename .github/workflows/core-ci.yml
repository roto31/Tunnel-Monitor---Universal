name: tunnel-monitor-core CI

on:
  push:
    paths:
      - 'Universal/vendor/core/**'
      - 'Universal/scripts/**'
      - '.github/workflows/core-ci.yml'
      - '.cursor/**'
  pull_request:
    paths:
      - 'Universal/vendor/core/**'
      - 'Universal/scripts/**'
      - '.github/workflows/core-ci.yml'
      - '.cursor/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq
      - name: Shellcheck core lib
        run: shellcheck Universal/vendor/core/lib/*.sh Universal/vendor/core/bin/monitor-engine.sh
      - name: Bats tests
        run: bats Universal/vendor/core/tests/
      - name: Validate folder structure
        run: TM_STRUCTURE_STRICT=1 bash Universal/scripts/validate-folder-structure.sh
