name: tunnel-monitor-core CI

on:
  push:
    paths:
      - 'vendor/core/**'
      - '.github/workflows/core-ci.yml'
  pull_request:
    paths:
      - 'vendor/core/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq
      - name: Shellcheck core lib
        run: shellcheck vendor/core/lib/*.sh vendor/core/bin/monitor-engine.sh
      - name: Bats tests
        run: bats vendor/core/tests/
