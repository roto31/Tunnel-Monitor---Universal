<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 280" role="img" aria-label="strongSwan IKE and CHILD security associations">
  <defs>
    <style>
      .box { fill:#f8fafc; stroke:#475569; stroke-width:2; rx:8; }
      .title { font:600 14px system-ui,sans-serif; fill:#0f172a; }
      .label { font:12px system-ui,sans-serif; fill:#334155; }
      .arrow { stroke:#0ea5e9; stroke-width:2; fill:none; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0ea5e9"/></marker>
  </defs>
  <rect class="box" x="20" y="80" width="150" height="120"/>
