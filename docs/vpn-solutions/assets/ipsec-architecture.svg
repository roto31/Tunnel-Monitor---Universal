  <text class="label" x="230" y="134">CHILD_SA ESP</text>
  <rect class="box" x="420" y="80" width="160" height="120"/>
  <text class="title" x="440" y="108">Remote gateway</text>
  <rect class="box" x="620" y="100" width="100" height="80"/>
  <text class="title" x="632" y="128">LAN</text>
  <path class="arrow" d="M170 140 H210"/>
