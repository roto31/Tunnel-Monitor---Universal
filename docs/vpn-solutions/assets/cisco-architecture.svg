<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-label="Cisco Secure Client SSL VPN topology">
  <defs>
    <style>
      .box { fill:#ecfdf5; stroke:#047857; stroke-width:2; rx:8; }
      .title { font:600 14px system-ui,sans-serif; fill:#064e3b; }
      .label { font:12px system-ui,sans-serif; fill:#065f46; }
      .arrow { stroke:#059669; stroke-width:2; fill:none; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#059669"/></marker>
  </defs>
  <rect class="box" x="20" y="70" width="180" height="120"/>
  <text class="title" x="40" y="98">Secure Client</text>
  <text class="label" x="40" y="122">vpn state / vpn stats</text>
  <text class="label" x="40" y="144">Pre-deployed profile</text>
  <rect class="box" x="260" y="70" width="180" height="120"/>
  <text class="title" x="280" y="98">Headend</text>
  <text class="label" x="280" y="122">ASA / FTD / vendor</text>
  <rect class="box" x="500" y="70" width="180" height="120"/>
  <text class="title" x="520" y="98">Internal apps</text>
  <path class="arrow" d="M200 130 H260"/>
  <path class="arrow" d="M440 130 H500"/>
  <text class="label" x="300" y="122">SSL VPN</text>
</svg>
