<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="FortiClient endpoint VPN topology">
  <defs>
    <style>
      .box { fill:#fff7ed; stroke:#c2410c; stroke-width:2; rx:8; }
      .ems { fill:#fef3c7; stroke:#b45309; stroke-width:2; stroke-dasharray:6 4; rx:8; }
      .title { font:600 14px system-ui,sans-serif; fill:#431407; }
      .label { font:12px system-ui,sans-serif; fill:#7c2d12; }
      .arrow { stroke:#ea580c; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#b45309; stroke-width:2; fill:none; stroke-dasharray:6 4; marker-end:url(#dash); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ea580c"/></marker>
    <marker id="dash" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/></marker>
  </defs>
  <rect class="box" x="20" y="50" width="190" height="180"/>
  <text class="title" x="40" y="78">Endpoint</text>
  <text class="label" x="40" y="110">FortiClient</text>
  <text class="label" x="40" y="132">forticlient vpn status</text>
  <text class="label" x="40" y="154">FortiVPN --cli (Win)</text>
  <rect class="ems" x="250" y="20" width="150" height="70"/>
  <text class="title" x="268" y="48">FortiClient EMS</text>
  <text class="label" x="268" y="70">Profiles / ZTNA</text>
  <rect class="box" x="250" y="130" width="190" height="100"/>
  <text class="title" x="270" y="158">FortiGate / edge</text>
  <text class="label" x="270" y="182">SSL or IPsec VPN</text>
  <rect class="box" x="510" y="90" width="190" height="100"/>
  <text class="title" x="530" y="118">Protected network</text>
  <path class="dash" d="M210 80 H250"/>
  <path class="arrow" d="M210 170 H250"/>
  <path class="arrow" d="M440 180 H510"/>
  <text class="label" x="300" y="205">VPN tunnel</text>
</svg>
