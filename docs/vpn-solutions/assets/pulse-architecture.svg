<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Ivanti ISAC endpoint to gateway topology">
  <defs>
    <style>
      .box { fill:#f4f6f8; stroke:#334155; stroke-width:2; rx:8; }
      .title { font:600 14px system-ui,sans-serif; fill:#0f172a; }
      .label { font:12px system-ui,sans-serif; fill:#334155; }
      .arrow { stroke:#2563eb; stroke-width:2; fill:none; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="box" x="20" y="40" width="180" height="200"/>
  <text class="title" x="40" y="68">Endpoint</text>
  <text class="label" x="40" y="100">ISAC agent</text>
  <text class="label" x="40" y="122">pulselauncher CLI</text>
  <text class="label" x="40" y="160">Trusted Server policy</text>
  <rect class="box" x="270" y="40" width="180" height="200"/>
  <text class="title" x="290" y="68">Ivanti gateway</text>
  <text class="label" x="290" y="100">Connect Secure (SSL)</text>
  <text class="label" x="290" y="122">Policy Secure L3</text>
  <rect class="box" x="520" y="80" width="180" height="120"/>
  <text class="title" x="540" y="108">Corporate LAN</text>
  <text class="label" x="540" y="140">Protected resources</text>
  <path class="arrow" d="M200 120 H270"/>
  <path class="arrow" d="M450 140 H520"/>
  <text class="label" x="210" y="112">SSL / L3 VPN</text>
</svg>
